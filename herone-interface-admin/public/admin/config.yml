# Configuration de Sveltia CMS, l'interface d'édition servie sur /admin.
#
# Ce que fait cette interface : elle lit et écrit directement les fichiers
# Markdown de src/content/blog dans le dépôt GitHub, sur la branche main.
# Enregistrer depuis /admin produit donc un commit, et Netlify redéploie.
# Il n'y a pas de base de données, pas de sauvegarde intermédiaire.
#
# Règle de conception : les champs décrits ici doivent refuser tout ce que le
# schéma Astro (src/content.config.ts) refuserait. Un frontmatter écrit depuis
# /admin ne doit jamais casser le build. Toute modification du schéma se
# reporte ici, et inversement.
#
# Authentification : voir la section « CMS » de CLAUDE.md. Par défaut, c'est le
# fournisseur OAuth GitHub installé sur le site Netlify qui authentifie
# (aucun champ à ajouter ci-dessous). Pour passer par le service officiel
# Sveltia sur Cloudflare Workers, ajouter sous `backend` :
#   base_url: https://sveltia-cms-auth.<sous-domaine>.workers.dev

backend:
  name: github
  repo: herone-dev/herone-siteweb
  branch: main
  commit_messages:
    create: 'blog: ajout de {{slug}} depuis /admin'
    update: 'blog: mise à jour de {{slug}} depuis /admin'
    delete: 'blog: suppression de {{slug}} depuis /admin'
    uploadMedia: 'blog: ajout du média {{path}}'
    deleteMedia: 'blog: suppression du média {{path}}'

# Chemins des médias. Le dossier est versionné comme le reste du site : une
# image téléversée depuis /admin arrive dans public/images/blog et l'article
# la référence par son chemin public.
media_folder: public/images/blog
public_folder: /images/blog

# La langue de l'interface suit celle du navigateur (Sveltia ne gère pas
# l'option locale).

collections:
  - name: blog
    label: Articles du blog
    label_singular: Article
    description: >-
      Les articles marqués BROUILLON attendent votre relecture et ne sont pas
      visibles sur le site. Pour publier, ouvrez l'article, décochez
      « Brouillon » et cliquez sur Enregistrer.
    folder: src/content/blog
    create: true
    # Le nom du fichier est le slug, et le slug est l'URL : /blog/<slug>.
    # Le renommer casse l'adresse d'un article déjà en ligne.
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    identifier_field: title

    # Ligne affichée pour chaque article dans la liste : statut, date, titre,
    # catégorie. Un article sans champ draft (les plus anciens) compte comme
    # en ligne, un champ absent valant faux pour le ternaire.
    summary: "{{draft | ternary('BROUILLON', 'EN LIGNE')}} · {{pubDate | date('DD/MM/YYYY')}} · {{title}} · {{category}}"

    # Tri : du plus récent au plus ancien par défaut, modifiable dans la liste.
    sortable_fields:
      fields: [pubDate, title, category, draft]
      default:
        field: pubDate
        direction: descending

    # Filtres. « En ligne » utilise ne (différent de) et pas pattern : un
    # article sans champ draft, comme les sept premiers du blog, ne correspond
    # qu'à ne et not_in. Avec pattern: false, ils disparaissaient tous.
    view_filters:
      filters:
        - name: brouillons
          label: Brouillons, en attente de publication
          field: draft
          eq: true
        - name: en-ligne
          label: En ligne sur le site
          field: draft
          ne: true

    # Regroupement proposé dans la liste, par année de publication. Le statut
    # se filtre plutôt qu'il ne se groupe : un groupe sur un champ vrai ou faux
    # s'afficherait « true » et « false ».
    view_groups:
      groups:
        - name: annee
          label: Année de publication
          field: pubDate
          pattern: '\d{4}'

    # Ordre des champs : ce qui sert tous les jours en haut, les réglages
    # techniques en bas. L'ordre n'a aucun effet sur le site.
    fields:
      - label: Brouillon (pas encore en ligne)
        name: draft
        widget: boolean
        required: false
        default: true
        hint: >-
          Coché, l'article n'apparaît nulle part sur le site. Pour le publier,
          décochez puis cliquez sur Enregistrer, il est en ligne une à deux
          minutes plus tard. Pour le retirer du site, recochez. Rien n'est
          jamais supprimé.

      - label: Titre
        name: title
        widget: string
        required: true
        hint: Soixante caractères au maximum, sinon Google le coupe.

      - label: Date de publication
        name: pubDate
        widget: datetime
        required: true
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: true
        hint: >-
          Règle l'ordre du blog. Au moment de publier un brouillon, mettez la
          date du jour avec le bouton « Aujourd'hui ».

      - label: Catégorie
        name: category
        widget: string
        required: true
        hint: >-
          Reprendre une catégorie existante, écrite à l'identique (Automatisation,
          Devis, CRM, BTP, Actualité IA, Réglementation, Formation, Cas d'usage).
          Une nouvelle orthographe crée un nouveau filtre sur le blog.

      - label: Description
        name: description
        widget: text
        required: true
        hint: >-
          Le chapô affiché sous le titre et la description vue dans Google.
          Pas de deux-points, c'est une règle de rédaction du blog.

      - label: Corps de l'article
        name: body
        widget: markdown
        required: true
        hint: >-
          Markdown pur. Pas de HTML, pas de listes, pas de citations, pas de
          tableaux, pas de blocs de code, pas d'emoji, pas de tiret cadratin.
          L'encart rendez-vous est posé automatiquement sur le site.

      - label: Temps de lecture (minutes)
        name: readingTime
        widget: number
        required: true
        value_type: int
        min: 1
        max: 30
        hint: Nombre de mots divisé par 200, arrondi.

      - label: Titre du système associé
        name: systemTitle
        widget: string
        required: true
        hint: >-
          Encart qui renvoie vers la page Automatisation. Valeurs habituelles,
          Devis automatisés, Comptes rendus automatiques, Connexion de vos outils.

      - label: En bref
        name: summary
        widget: list
        required: false
        max: 4
        field: { label: Phrase, name: phrase, widget: string }
        hint: Quatre phrases au maximum. Vide, l'encart ne s'affiche pas.

      - label: Mots-clés
        name: tags
        widget: list
        required: false
        default: []
        field: { label: Mot-clé, name: tag, widget: string }

      - label: Date de mise à jour
        name: updatedDate
        widget: datetime
        required: false
        format: 'YYYY-MM-DD'
        date_format: 'DD/MM/YYYY'
        time_format: false
        picker_utc: true
        hint: À renseigner seulement quand un article déjà publié est repris.

      - label: Auteur
        name: author
        widget: string
        required: false
        default: Hérone
        hint: >-
          Doit correspondre à une fiche de src/data/authors.ts, sinon c'est la
          fiche « Hérone » qui s'affiche.

      - label: Image
        name: image
        widget: image
        required: false
        hint: Optionnelle, le blog n'affiche pas d'image de couverture.

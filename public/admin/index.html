<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Cette page ne doit jamais être indexée : elle n'a rien à faire dans
         les résultats de recherche, et elle est déjà absente du plan de site
         (qui ne liste que les pages produites par Astro). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Édition du blog Hérone</title>
  </head>
  <body>
    <!-- Sveltia CMS, chargé depuis le CDN. La version est volontairement non
         figée : le CMS ne fait pas partie du site public, une régression
         n'y empêche pas le blog de s'afficher, et figer la version obligerait à
         suivre les mises à jour à la main. -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <!-- Aperçu fidèle : le panneau de droite affiche l'article avec le vrai
         gabarit et les vrais styles du blog (voir apercu.js). marked convertit
         le Markdown en HTML ; il est copié ici (v15.0.12, licence MIT) plutôt
         que chargé d'un CDN, pour que l'aperçu ne dépende de personne. -->
    <script src="/admin/marked.umd.js"></script>
    <script src="/admin/apercu.js"></script>
    <!-- Accès à la page Statistiques (impressions Google, visites, clics par
         article). Posé hors de Sveltia, qui n'offre pas d'entrée de menu
         personnalisée : un simple lien flottant en bas à gauche. -->
    <a href="/admin/stats/" id="hrn-lien-stats">Statistiques</a>
    <style>
      #hrn-lien-stats {
        position: fixed; left: 16px; bottom: 16px; z-index: 9999;
        display: inline-flex; align-items: center; gap: 6px;
        background: #101C29; color: #F1EEE1; text-decoration: none;
        font: 600 13px/1 system-ui, sans-serif; padding: 10px 14px;
        border-radius: 999px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
      }
      #hrn-lien-stats::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #4FD0C5; }
      #hrn-lien-stats:hover { background: #0B7D76; }
      #hrn-lien-stats:focus-visible { outline: 2px solid #4FD0C5; outline-offset: 2px; }
    </style>
  </body>
</html>
